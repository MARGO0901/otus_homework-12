name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: sdukshis/cppml:latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true

      # конфигурация Conan
      - name: Configure Conan
        run: |
          conan profile new default --detect

      # Сборка проекта
      - name: Build project
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DPATCH_VERSION=${{ github.run_number }}
          make
          cpack -G DEB

      # Запуск тестов
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/fashion_mnist-0.0.${{ github.run_number }}-Linux.deb
          asset_name: fashion_mnist-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package